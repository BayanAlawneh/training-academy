<div class="dashboard">
  <header>
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:26px;">
      <div class="brand-mark">TA</div>
      <span style="color:var(--on-ink); font-size:13px; font-weight:700;">أكاديمية التدريب</span>
    </div>

    <ul class="modules">
      <li>
        <span style="display:flex; align-items:center; gap:9px; padding:11px 13px; color:var(--on-ink-muted); font-weight:700; font-size:13.5px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4.5C4 3.7 4.7 3 5.5 3H12v18H5.5c-.8 0-1.5-.7-1.5-1.5z"/><path d="M20 4.5c0-.8-.7-1.5-1.5-1.5H12v18h6.5c.8 0 1.5-.7 1.5-1.5z"/></svg>
          كورساتي
        </span>
      </li>
      <li>
        <span style="display:flex; align-items:center; gap:9px; padding:11px 13px; color:var(--on-ink-muted); font-weight:700; font-size:13.5px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="4" width="14" height="17" rx="1.5"/><path d="M8 11h8M8 14.5h8M8 18h5"/></svg>
          حضوري
        </span>
      </li>
      <li>
        <span style="display:flex; align-items:center; gap:9px; padding:11px 13px; color:var(--on-ink-muted); font-weight:700; font-size:13.5px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3.5v6c0 4.4-3 7.7-7 8.5-4-.8-7-4.1-7-8.5v-6z"/><path d="M9 12l2 2 4-4"/></svg>
          علاماتي
        </span>
      </li>
    </ul>

    <div style="margin-top:auto; display:flex; align-items:center; gap:9px; padding-top:16px; border-top:1px solid rgba(231,237,232,.14);">
      <div class="role">{{ auth.role()?.charAt(0) }}</div>
      <span style="color:var(--on-ink); font-size:12.5px; font-weight:600;">{{ auth.user()?.name }}</span>
    </div>
  </header>

  <div class="content-area">
    <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:26px;">
      <div>
        <p class="hint" style="font-family:var(--font-mono); letter-spacing:.07em; margin-bottom:2px;">لوحة المتدرّب</p>
        <h1>مرحباً، {{ auth.user()?.name }}</h1>
      </div>
      <button class="btn-quiet" (click)="logout()">خروج</button>
    </div>

    <div class="card">
      <p style="color:var(--muted); font-size:14px; margin:0;">عرض الكورسات والحضور والعلامات سيُضاف قريباً.</p>
    </div>
  </div>
</div>
